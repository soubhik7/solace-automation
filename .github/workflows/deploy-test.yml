name: Deploy to Test — Mars Solace

on:
  workflow_dispatch:
    inputs:
      skip_ep:
        description: 'Skip Event Portal phase?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      skip_cluster:
        description: 'Skip Cluster phase?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    environment: test          # ← requires approval gate in GitHub Environments

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Set context
        env:
          SOLACE_API_TOKEN:  ${{ secrets.SOLACE_API_TOKEN_TEST }}
          SOLACE_SERVICE_ID: ${{ secrets.SOLACE_SERVICE_ID_TEST }}
        run: |
          python3 solace.py context set-token --token "$SOLACE_API_TOKEN"
          python3 solace.py service use "$SOLACE_SERVICE_ID"

      - name: Dry-run (validate config)
        run: |
          python3 solace.py provision run \
            --config config/test/service.json \
            --dry-run

      # ── APPROVAL GATE ─────────────────────────────────────────────────────
      # Handled by GitHub "environment protection rules".
      # Add required reviewers in: Settings → Environments → test
      # Deployment pauses here until an approver clicks "Approve" in GitHub UI.

      - name: Deploy — Event Portal
        if: ${{ inputs.skip_ep != 'true' }}
        run: |
          python3 solace.py provision run \
            --config config/test/service.json \
            --skip-cluster

      - name: Deploy — Cluster Objects
        if: ${{ inputs.skip_cluster != 'true' }}
        run: |
          python3 solace.py provision run \
            --config config/test/service.json \
            --skip-ep

      - name: Show cluster status
        run: python3 solace.py cluster status

      - name: Notify success
        if: success()
        run: echo "✅ Test deployment complete"

      - name: Notify failure
        if: failure()
        run: echo "❌ Test deployment failed"
